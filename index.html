<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #1d4ed8;
    color: white;
    padding: 25px;
    text-align: center;
}

header p {
    margin-top: 8px;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 15px;
}

.stats {
    background: white;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px #00000010;
}

.stats h2 {
    color: #2563eb;
    margin-top: 10px;
    font-size: 32px;
}

.form-box, .table-box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px #00000010;
}

h2 {
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
}

.form-buttons {
    margin-top: 20px;
    display: flex;
    gap: 10px;
}

button {
    padding: 11px 18px;
    border: none;
    border-radius: 6px;
    color: white;
    background: #2563eb;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    opacity: 0.85;
}

.cancel {
    background: #64748b;
}

.edit {
    background: #0d9488;
    margin-right: 5px;
}

.delete {
    background: #dc2626;
}

.search {
    margin-bottom: 20px;
    max-width: 350px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 13px;
    border-bottom: 1px solid #e2e8f0;
    text-align: left;
}

th {
    background: #dbeafe;
}

.message {
    background: #dcfce7;
    color: #166534;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 6px;
    display: none;
}

.empty {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

.table-wrapper {
    overflow-x: auto;
}

footer {
    text-align: center;
    padding: 20px;
    color: #64748b;
}

@media(max-width: 650px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Student Management System</h1>
    <p>Manage Student Records Easily</p>
</header>

<div class="container">

    <div class="stats">
        <h3>Total Students</h3>
        <h2 id="totalStudents">0</h2>
    </div>

    <div class="form-box">

        <h2 id="formTitle">Add New Student</h2>

        <div id="message" class="message"></div>

        <form id="studentForm">

            <div class="form-grid">

                <div>
                    <label>Roll Number</label>
                    <input type="text" id="roll" required
                           placeholder="Enter roll number">
                </div>

                <div>
                    <label>Student Name</label>
                    <input type="text" id="name" required
                           placeholder="Enter student name">
                </div>

                <div>
                    <label>Email Address</label>
                    <input type="email" id="email" required
                           placeholder="Enter email">
                </div>

                <div>
                    <label>Phone Number</label>
                    <input type="tel" id="phone" required
                           placeholder="Enter phone number">
                </div>

                <div>
                    <label>Course</label>
                    <input type="text" id="course" required
                           placeholder="Enter course">
                </div>

            </div>

            <div class="form-buttons">
                <button type="submit" id="saveButton">
                    Add Student
                </button>

                <button type="button" class="cancel"
                        id="cancelButton" hidden>
                    Cancel
                </button>
            </div>

        </form>
    </div>

    <div class="table-box">

        <h2>Student Records</h2>

        <input type="text" id="search"
               class="search"
               placeholder="Search by name or roll number">

        <div class="table-wrapper">

            <table>
                <thead>
                    <tr>
                        <th>Roll No.</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentList"></tbody>
            </table>

        </div>

        <p id="emptyMessage" class="empty">
            No student records found.
        </p>

    </div>

</div>

<footer>
    Student Management System | Created using HTML, CSS and JavaScript
</footer>

<script>

// Get saved students from browser storage
let students = [];

try {
    const saved = JSON.parse(
        localStorage.getItem("students")
    );

    students = Array.isArray(saved) ? saved : [];
} catch {
    students = [];
}

let editIndex = null;


// Save students in browser storage
function saveData() {
    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );
}


// Show message
function showMessage(text) {
    const message = document.getElementById("message");

    message.textContent = text;
    message.style.display = "block";

    setTimeout(() => {
        message.style.display = "none";
    }, 3000);
}


// Display student records
function displayStudents() {

    const list = document.getElementById("studentList");
    const search = document.getElementById("search")
                         .value.toLowerCase();

    list.replaceChildren();

    const filtered = students
        .map((student, index) => ({student, index}))
        .filter(item =>
            item.student.name.toLowerCase().includes(search) ||
            item.student.roll.toLowerCase().includes(search)
        );

    filtered.forEach(item => {

        const student = item.student;
        const index = item.index;

        const row = document.createElement("tr");

        const values = [
            student.roll,
            student.name,
            student.email,
            student.phone,
            student.course
        ];

        values.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });

        const actionCell = document.createElement("td");

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.className = "edit";
        editButton.addEventListener("click", () => editStudent(index));

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";
        deleteButton.addEventListener("click", () => deleteStudent(index));

        actionCell.append(editButton, deleteButton);
        row.appendChild(actionCell);

        list.appendChild(row);
    });

    document.getElementById("totalStudents").textContent =
        students.length;

    document.getElementById("emptyMessage").style.display =
        filtered.length === 0 ? "block" : "none";
}


// Add or update student
document.getElementById("studentForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const student = {
        roll: document.getElementById("roll").value.trim(),
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        course: document.getElementById("course").value.trim()
    };

    if (Object.values(student).some(value => !value)) {
        alert("Please fill in all fields.");
        return;
    }

    const duplicate = students.some((item, index) =>
        item.roll.toLowerCase() === student.roll.toLowerCase()
        && index !== editIndex
    );

    if (duplicate) {
        alert("This roll number already exists!");
        return;
    }

    if (editIndex === null) {
        students.push(student);
        showMessage("Student added successfully!");
    } else {
        students[editIndex] = student;
        showMessage("Student updated successfully!");
    }

    saveData();
    resetForm();
    displayStudents();

});


// Edit student
function editStudent(index) {

    const student = students[index];

    document.getElementById("roll").value = student.roll;
    document.getElementById("name").value = student.name;
    document.getElementById("email").value = student.email;
    document.getElementById("phone").value = student.phone;
    document.getElementById("course").value = student.course;

    editIndex = index;

    document.getElementById("formTitle").textContent =
        "Update Student";

    document.getElementById("saveButton").textContent =
        "Update Student";

    document.getElementById("cancelButton").hidden = false;

    window.scrollTo({top: 0, behavior: "smooth"});
}


// Delete student
function deleteStudent(index) {

    if (confirm("Are you sure you want to delete this student?")) {

        students.splice(index, 1);

        saveData();
        displayStudents();

        resetForm();

        showMessage("Student deleted successfully!");
    }
}


// Reset form
function resetForm() {

    document.getElementById("studentForm").reset();

    editIndex = null;

    document.getElementById("formTitle").textContent =
        "Add New Student";

    document.getElementById("saveButton").textContent =
        "Add Student";

    document.getElementById("cancelButton").hidden = true;
}


// Cancel editing
document.getElementById("cancelButton")
.addEventListener("click", resetForm);


// Search students
document.getElementById("search")
.addEventListener("input", displayStudents);


// Load records when page opens
displayStudents();

</script>

</body>
</html>
